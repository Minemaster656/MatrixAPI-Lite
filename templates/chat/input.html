<div class="bg-black/60 backdrop-blur-lg rounded-xl p-4">
    <div class="flex flex-col gap-3">
        <div class="flex gap-2">
            <select id="character-select" class="flex-1 px-4 py-2 rounded-lg bg-white/10 border border-white/20 text-white">
            </select>
            <select id="message-target" class="flex-1 px-4 py-2 rounded-lg bg-white/10 border border-white/20 text-white">
                <option value="">Всем</option>
            </select>
        </div>
        <textarea id="message" class="w-full px-4 py-2 rounded-lg bg-white/10 border border-white/20 text-white placeholder-white/50" rows="3" placeholder="Введите сообщение (поддерживает markdown)"></textarea>
        <button onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition">
            Отправить
        </button>
    </div>
</div>
