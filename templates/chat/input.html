<div class="bg-black/60 backdrop-blur-lg rounded-xl p-4">
    <div class="flex flex-col gap-3">
        <div class="flex gap-2 items-center">
            <select id="character-select" class="flex-1 px-4 py-2 rounded-lg bg-white/10 border border-white/20 text-white">
            </select>
            <select id="message-target" class="flex-1 px-4 py-2 rounded-lg bg-white/10 border border-white/20 text-white">
                <option value="">Всем</option>
            </select>
        </div>
        
        <div class="flex items-center gap-4">
            <label class="flex items-center cursor-pointer gap-2">
                <span class="text-white text-sm">OOC</span>
                <div class="relative">
                    <input type="checkbox" id="ooc-toggle" class="sr-only peer" onchange="toggleOocMode()">
                    <div class="w-11 h-6 bg-gray-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-purple-600"></div>
                </div>
            </label>
            <select id="ooc-user-select" class="hidden flex-1 px-4 py-2 rounded-lg bg-purple-900/50 border border-purple-500/50 text-white text-sm">
            </select>
            <span id="ooc-label" class="text-gray-400 text-sm hidden">Вы отправляете как пользователь</span>
        </div>
        
        <textarea id="message" class="w-full px-4 py-2 rounded-lg bg-white/10 border border-white/20 text-white placeholder-white/50" rows="3" placeholder="Введите сообщение (поддерживает markdown)"></textarea>
        <button onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition">
            Отправить
        </button>
    </div>
</div>
