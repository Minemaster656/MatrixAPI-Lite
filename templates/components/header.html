<header class="fixed top-0 left-0 right-0 z-50 bg-gray-900/80 backdrop-blur-md border-b border-gray-800">
    <nav class="container mx-auto px-4 py-3 flex items-center justify-between">
        <a href="/" class="flex items-center gap-3 text-xl font-bold text-white hover:text-blue-400 transition">
            <img src="/static/assets/img/logo_128.png" alt="MatrixAPI" class="h-8 w-8">
            <span>MatrixAPI</span>
        </a>
        <div class="flex items-center gap-4">
            <a href="/" class="text-gray-300 hover:text-white transition">Главная</a>
            <a href="/chat" class="text-gray-300 hover:text-white transition">Играть</a>
            <a href="/dashboard" class="text-gray-300 hover:text-white transition hidden" id="nav-dashboard">Dashboard</a>
            <div id="auth-buttons" class="flex items-center gap-2">
                <a href="/login" class="text-gray-300 hover:text-white transition">Войти</a>
                <a href="/register" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition">
                    Регистрация
                </a>
            </div>
            <div id="user-menu" class="hidden items-center gap-2">
                <span id="user-name" class="text-gray-300"></span>
                <button onclick="logout()" class="text-red-400 hover:text-red-300 text-sm">Выход</button>
            </div>
        </div>
    </nav>
</header>
<script>
function checkAuth() {
    const token = localStorage.getItem('access_token');
    const authButtons = document.getElementById('auth-buttons');
    const userMenu = document.getElementById('user-menu');
    const navDashboard = document.getElementById('nav-dashboard');
    
    if (token) {
        fetch('/auth/me', {
            headers: { 'Authorization': 'Bearer ' + token }
        })
        .then(r => r.ok ? r.json() : null)
        .then(user => {
            if (user) {
                authButtons.classList.add('hidden');
                userMenu.classList.remove('hidden');
                userMenu.classList.add('flex');
                navDashboard.classList.remove('hidden');
                document.getElementById('user-name').textContent = user.username;
            } else {
                localStorage.removeItem('access_token');
            }
        })
        .catch(() => localStorage.removeItem('access_token'));
    }
}

function logout() {
    localStorage.removeItem('access_token');
    window.location.href = '/';
}

checkAuth();
</script>
