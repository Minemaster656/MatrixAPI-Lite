<script src="https://cdn.jsdelivr.net/npm/tsparticles@2.11.1"></script>
<script>
    const isMobile = window.innerWidth < 768;
    const particleCount = isMobile ? 60 : 200;
    
    tsParticles.load("tsparticles", {
        fpsLimit: 60,
        background: { color: { value: "transparent" } },
        particles: {
            number: { value: particleCount },
            color: { value: ["#60a5fa", "#a78bfa", "#f472b6"] },
            shape: { type: "circle" },
            opacity: { value: 0.6, random: true },
            size: { value: 2, random: true },
            move: {
                enable: true,
                speed: 0.5,
                direction: "none",
                random: true,
                straight: false,
            },
            links: {
                enable: true,
                distance: 100,
                color: "#6366f1",
                opacity: 0.2,
                width: 1,
            },
        },
        interactivity: {
            events: {
                onHover: { enable: true, mode: "repulse" },
            },
            modes: {
                repulse: { distance: 100, duration: 0.4 },
            },
        },
        detectRetina: true,
    });
</script>
